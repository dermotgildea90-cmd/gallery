name: Local API APK
on:
  workflow_dispatch:
  push:
    branches: [1.0.19-local-api]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0'
      - name: Build and test
        working-directory: Android/src
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-1.0.19-local-api-debug
          path: Android/src/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-api-test-results
          path: Android/src/app/build/reports/tests/testDebugUnitTest
